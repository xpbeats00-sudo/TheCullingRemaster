; Last Breath prototype tuning (Showdown/Showdown_mode.md section 14).
; Read by server/lastbreath.js. Starting points, not balanced values.
[LastBreath]
RoundsToWin=4
MaxRounds=7
FullSafeDurationSeconds=120
InitialCollapseDurationSeconds=30
AcceleratedCollapseDurationSeconds=30
CriticalCollapseDurationSeconds=30
FinalCollapseDurationSeconds=30

InitialGasDamagePerSecond=5
AcceleratedGasDamagePerSecond=10
CriticalGasDamagePerSecond=20
FinalGasDamagePerSecond=35

SupportedTeamSizes=1,2,3,4
RespawnsEnabled=false
HealingEnabled=true

; Not in the spec: the safe radius at the end of each collapse phase, as a
; fraction of the starting radius (the spec only says "small central area"
; and "approaches zero").
InitialCollapseEndRadiusFraction=0.7
AcceleratedCollapseEndRadiusFraction=0.4
CriticalCollapseEndRadiusFraction=0.15
FinalCollapseEndRadiusFraction=0
; Boundary tolerance in world units (cm) against edge jitter.
BoundaryToleranceUnits=50
; Server damage interval.
DamageTickSeconds=0.5
